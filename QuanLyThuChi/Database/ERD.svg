    <path d="M400 238h95v148h125m-20-12 20 12-20 12m-200-172v24" fill="none" stroke="#167454" stroke-width="2"/>
    <text x="417" y="224" font-size="18" font-weight="700">1</text>
    <text x="574" y="369" font-size="18" font-weight="700">N</text>
    <text x="60" y="565" font-size="16" fill="#6b7c77">Khóa ngoại bảo toàn danh mục. Thống kê chỉ cộng các giao dịch có Status = 1.</text>
  </g>
