<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <rect width="1100" height="600" fill="#f5f8f7"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#1b302c">
